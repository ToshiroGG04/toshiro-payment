
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOSHIRO CPM | PAYMENT</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: #030303;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px 12px;
  overflow-x: hidden;
}

/* ANIMATED BACKGROUND */

body::before {
  content: "";
  position: fixed;
  inset: -50%;
  z-index: -2;
  background:
    radial-gradient(circle at 20% 30%, #ff001e55, transparent 30%),
    radial-gradient(circle at 80% 60%, #8b001c55, transparent 35%),
    radial-gradient(circle at 50% 50%, #320008, transparent 60%);
  filter: blur(65px);
  animation: smoke 8s infinite alternate ease-in-out;
}

@keyframes smoke {
  from { transform: translate(-5%, -5%) scale(1); }
  to { transform: translate(5%, 7%) scale(1.2); }
}

/* DIGITAL ENCODING */

.code-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
}

.code-bg span {
  position: absolute;
  top: -100%;
  color: #ff001e;
  opacity: .17;
  font: bold 13px monospace;
  line-height: 2;
  writing-mode: vertical-rl;
  text-shadow: 0 0 10px red;
  animation: falling linear infinite;
}

@keyframes falling {
  from { transform: translateY(-10%); }
  to { transform: translateY(220vh); }
}

/* MAIN */

.container {
  width: 100%;
  max-width: 550px;
  text-align: center;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  border: 1px solid #7c1020;
  border-radius: 30px;
  padding: 8px 15px;
  color: #ff697b;
  font-size: 10px;
  letter-spacing: 2px;
  margin-bottom: 17px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: red;
  box-shadow: 0 0 12px red;
  animation: blink 1s infinite alternate;
}

@keyframes blink {
  to { opacity: .3; }
}

h1 {
  font-size: clamp(30px, 8vw, 45px);
  font-weight: 1000;
  letter-spacing: 2px;
  text-shadow: 0 0 12px red, 0 0 30px #ff001e;
}

.subtitle {
  color: #ff394e;
  letter-spacing: 5px;
  font-size: 11px;
  margin: 10px 0 25px;
}

/* RUNNING BORDER */

.picture-frame {
  position: relative;
  padding: 4px;
  border-radius: 18px;
  isolation: isolate;
}

.picture-frame::before {
  content: "";
  position: absolute;
  inset: -3px;
  z-index: -1;
  border-radius: 21px;
  background: conic-gradient(
    from var(--angle),
    transparent,
    #ff001e,
    #ffffff,
    #ff001e,
    transparent,
    #8b001c,
    transparent
  );
  animation: rotate 2s linear infinite;
}

.picture-frame::after {
  content: "";
  position: absolute;
  inset: -8px;
  z-index: -2;
  background: #ff001e;
  filter: blur(22px);
  opacity: .5;
  animation: glow 2s infinite alternate;
}

@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

@keyframes rotate {
  to { --angle: 360deg; }
}

@keyframes glow {
  to { opacity: .9; }
}

/* PAYMENT IMAGE */

.payment-image {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 14px;
  background: black;
}

/* SCAN TEXT */

.scan {
  margin-top: 28px;
  font-size: 19px;
  font-weight: 900;
  letter-spacing: 2px;
  animation: textGlow 1.5s infinite alternate;
}

@keyframes textGlow {
  to { text-shadow: 0 0 15px red, 0 0 30px red; }
}

.description {
  color: #aaa;
  font-size: 12px;
  line-height: 1.8;
  margin-top: 12px;
}

/* SOCIAL LINKS */

.socials {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 25px;
}

.socials a {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 14px;
  background: #100709;
  border: 1px solid #8e1424;
  border-radius: 10px;
  color: white;
  text-decoration: none;
  font-size: 12px;
  font-weight: bold;
  transition: .3s;
}

.socials a:hover {
  background: #700013;
  box-shadow: 0 0 20px red;
  transform: translateY(-4px);
}

.socials svg {
  width: 19px;
  height: 19px;
}

.footer {
  margin-top: 28px;
  color: #ff263e;
  font-size: 10px;
  letter-spacing: 4px;
}

@media (max-width: 400px) {
  .socials a {
    padding: 9px;
    font-size: 10px;
  }
}
</style>
</head>

  bg.appendChild(span);
}
</script>
